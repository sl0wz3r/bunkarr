# Release on tags vX.Y.Z (or vX.Y.Z-pre.N) in the public GitHub repository: run the tests, then
# build the multi-arch image (linux/amd64, linux/arm64) and push it to ghcr.io/<owner>/bunkarr
# with the workflow's own GITHUB_TOKEN. After the FIRST push, make the ghcr.io package public by
# hand (package settings): new packages are private and Unraid needs anonymous pulls.
#
# Tags: vX.Y.Z pushes :X.Y.Z, :X.Y and :latest; a pre-release pushes only its own tag, so :latest
# never points at a pre-release. Any other v* tag fails before anything is built.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check the tag
        id: tag
        run: |
          set -eu
          if ! printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '${GITHUB_REF_NAME}' is not a release version (vX.Y.Z or vX.Y.Z-pre.N)" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: |
          set -eu
          (cd web && npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build)
          CGO_ENABLED=1 go test -race -count=1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          (cd web && npm audit --omit=dev --audit-level=moderate)

  image:
    name: image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/bunkarr" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Test the image for the runner's platform before anything is pushed.
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: bunkarr:release-test
          build-args: |
            VERSION=${{ needs.test.outputs.version }}
            COMMIT=${{ github.sha }}

      - name: Test image
        run: sh docker/test-image.sh bunkarr:release-test

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.test.outputs.version }}
          PRERELEASE: ${{ needs.test.outputs.prerelease }}
        run: |
          set -eu
          tags="${IMAGE}:${VERSION}"
          if [ "$PRERELEASE" = false ]; then
            minor="${VERSION%.*}"
            tags="${tags},${IMAGE}:${minor},${IMAGE}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.test.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.tags.outputs.date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
