# Release on tags vX.Y.Z (or vX.Y.Z-pre.N) in the public GitHub repository. The multi-arch image
# (linux/amd64, linux/arm64) is built ONCE and pushed to ghcr.io/<owner>/bunkarr as a candidate,
# :candidate-<commit>, with the workflow's own GITHUB_TOKEN; the acceptance tests
# (docs/design/phase1.md §9) run the e2e suite and the Docker suite against that very image, pulled
# by digest on an amd64 and an arm64 runner; only then does the image job put the release tags on
# the same digest (no rebuild, so what ships is byte for byte what was tested). Nothing gets a
# release tag unless every test job passed; a failed candidate stays under its candidate tag.
# After the FIRST push, make the ghcr.io package public by hand (package settings): new packages
# are private and Unraid needs anonymous pulls.
#
# Tags: vX.Y.Z pushes :X.Y.Z, :X.Y and :latest; a pre-release pushes only its own tag, so :latest
# never points at a pre-release. Any other v* tag fails before anything is built.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check the tag
        id: tag
        run: |
          set -eu
          if ! printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '${GITHUB_REF_NAME}' is not a release version (vX.Y.Z or vX.Y.Z-pre.N)" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: |
          set -eu
          (cd web && npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build)
          CGO_ENABLED=1 go test -race -count=1 -timeout 45m ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          (cd web && npm audit --omit=dev --audit-level=moderate)

  # Acceptance 1-3 (docs/design/phase1.md §9): builds the real binary and drives it through its
  # API over generated fixture trees: full and incremental syncs, hardlinks, kill -9 at fault
  # points and resume, missing marker, empty source, dry run, change guard, source never modified.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Go - e2e
        run: go test -tags e2e -count=1 -timeout 20m ./internal/e2e/...

  # The release image, built once for every platform and pushed under a candidate tag. The docker
  # jobs test it by digest; the image job tags that digest.
  candidate:
    name: candidate image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: image
        run: |
          echo "name=ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/bunkarr" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.test.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.image.outputs.date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

  # The Docker suite against the candidate, pulled by digest, on each platform it ships for. The
  # drivers are Go tests (internal/e2e).
  docker:
    name: docker tests (${{ matrix.arch }})
    needs: [test, candidate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: go.sum

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # bunkarr:release-test is the candidate's image for this runner's platform, run natively.
      - name: Pull the candidate
        env:
          REF: ${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          set -eu
          server=$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')
          if [ "$server" != "$PLATFORM" ]; then
            echo "this runner's Docker is $server, want $PLATFORM" >&2
            exit 1
          fi
          docker pull --platform "$PLATFORM" "$REF"
          docker tag "$REF" bunkarr:release-test
          got=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' bunkarr:release-test)
          if [ "$got" != "$PLATFORM" ]; then
            echo "bunkarr:release-test is $got, want $PLATFORM" >&2
            exit 1
          fi

      # Healthcheck, first-run setup, API key auth, UI, PUID/PGID ownership, clean SIGTERM stop.
      - name: Test image
        run: sh docker/test-image.sh bunkarr:release-test

      # Acceptance 3 in the container: docker kill -s KILL mid-copy, docker start, the job resumes.
      - name: Container kill test
        run: sh docker/test-kill.sh bunkarr:release-test

      # Acceptance 4: Plex DB backup under write load, Plex SQLite integrity_check, restore into a
      # second Plex; Plex sections with path mappings, a source imported from Plex, synced.
      - name: Plex backup/restore test
        run: sh docker/test-plex-restore.sh bunkarr:release-test

      # The sync lifecycle and kill tests with every destination on a real SMB and NFS share.
      - name: Network share test
        run: sh docker/test-shares.sh bunkarr:release-test

  # Puts the release tags on the tested candidate's digest; every tag must resolve to it.
  image:
    name: image
    needs: [test, e2e, candidate, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested image
        env:
          IMAGE: ${{ needs.candidate.outputs.image }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
          VERSION: ${{ needs.test.outputs.version }}
          PRERELEASE: ${{ needs.test.outputs.prerelease }}
        run: |
          set -eu
          tags="${IMAGE}:${VERSION}"
          if [ "$PRERELEASE" = false ]; then
            tags="${tags} ${IMAGE}:${VERSION%.*} ${IMAGE}:latest"
          fi
          set --
          for t in $tags; do set -- "$@" --tag "$t"; done
          docker buildx imagetools create "$@" "${IMAGE}@${DIGEST}"
          for t in $tags; do
            got=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$t")
            if [ "$got" != "$DIGEST" ]; then
              echo "$t is $got, not the tested $DIGEST" >&2
              exit 1
            fi
            echo "$t -> $got"
          done
