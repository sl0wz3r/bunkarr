# CI on every branch push and pull request: web UI (typecheck, tests, build), Go (gofmt, vet, race
# tests, build, govulncheck), npm audit, shellcheck, and the Docker image (build + smoke test, no
# push). Releases: release.yml, on tags. Actions are pinned to full commit SHAs (the comment names
# the release; Renovate bumps both). The token is read-only and never persisted.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Latest 1.27.x patch; keep in step with go.mod and the Dockerfile's golang image.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web - install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Web - typecheck
        working-directory: web
        run: npm run typecheck

      - name: Web - test
        working-directory: web
        run: npm test

      # The Go binary embeds web/dist, so build the UI before the Go steps.
      - name: Web - build
        working-directory: web
        run: npm run build

      - name: Go - gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go - vet
        run: go vet ./...

      # -race needs cgo; release builds use CGO_ENABLED=0.
      - name: Go - test (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Go - build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o bin/bunkarr ./cmd/bunkarr && ./bin/bunkarr version

      - name: Go - govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Web - npm audit (runtime dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate

      - name: Shell - shellcheck
        run: shellcheck docker/*.sh

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: bunkarr:ci
          provenance: false
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}

      # Healthcheck, first-run setup, API key auth, UI, PUID/PGID ownership, clean SIGTERM stop.
      - name: Test image
        run: sh docker/test-image.sh bunkarr:ci
